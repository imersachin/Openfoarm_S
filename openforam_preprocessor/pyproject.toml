[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openfoam-preprocessor"
version = "0.1.0"
description = "Deterministic OpenFOAM preprocessing and mesh validation"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.10,<3",
  "numpy>=2.0,<3",
  "scipy>=1.14,<2",
  "polars>=1.20,<2",
  "trimesh>=4.6,<5",
  "psutil>=6.0,<8",  # available RAM for resource preflight
  "streamlit>=1.42,<2",
  "plotly>=6.0,<7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "ruff>=0.9,<1",
  "mypy>=1.14,<2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
